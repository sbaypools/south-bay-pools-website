name: Rename preview to index
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git mv south-bay-pools-website-preview.html index.html
          git config user.name "sbaypools"
          git config user.email "sbaypools@users.noreply.github.com"
          git commit -m "Rename south-bay-pools-website-preview.html to index.html"
          git push
